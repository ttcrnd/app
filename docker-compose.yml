services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
      REVIEW_SERVICE_HOST: 0.0.0.0
      REVIEW_SERVICE_PORT: 8000
      REVIEW_SERVER_RELOAD: "true"
      REVIEW_LOG_LEVEL: ${REVIEW_LOG_LEVEL:-INFO}
    volumes:
      - ./:/app
    command: python -m uvicorn server:app --host 0.0.0.0 --port 8000 --reload
